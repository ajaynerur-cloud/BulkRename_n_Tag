# Builds the NameTag Android app (Trusted Web Activity) from this repository.
# Output: a signed APK (install directly) and an AAB (for Google Play), as run artifacts,
# and as a GitHub Release when you push a tag like v1.2.0.
#
# One-time setup (see README, "Android APK"):
#   Settings > Secrets and variables > Actions > Variables:
#     PWA_HOST            your Render domain, e.g. nametag-abcd.onrender.com (no https://)
#     ANDROID_PACKAGE_ID  optional, default app.nametag.twa
#   Settings > Secrets and variables > Actions > Secrets (create them with the
#   "Android signing key (run once)" workflow):
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
# Without the secrets the build still works, but uses a throwaway key: fine for a quick test,
# but the app shows a browser bar and cannot be updated in place later.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 1.2.0 (empty: from scripts/android/twa-config.json)'
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PWA_HOST: ${{ vars.PWA_HOST }}
      ANDROID_PACKAGE_ID: ${{ vars.ANDROID_PACKAGE_ID }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Check settings
        run: |
          if [ -z "$PWA_HOST" ]; then
            echo "::warning::Repository variable PWA_HOST is not set. Using the default from scripts/android/twa-config.json. Set it to your Render domain."
          fi
          case "$PWA_HOST" in http*|*/*) echo "::error::PWA_HOST must be a bare domain like nametag.onrender.com (no https://, no slash)."; exit 1;; esac

      - name: Version
        run: |
          V="${{ inputs.version_name }}"
          if [ -z "$V" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$V" ]; then V=$(node -p "require('./scripts/android/twa-config.json').versionName"); fi
          echo "ANDROID_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "Version $V (code $ANDROID_VERSION_CODE)"

      - name: Signing key
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/nametag.keystore"
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            echo "temp=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key secrets found. Building with a throwaway key (test only). Run the 'Android signing key (run once)' workflow and add the secrets."
            keytool -genkeypair -keystore "$KS" -alias nametag -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass temporary-key -keypass temporary-key -dname "CN=NameTag test, O=NameTag" -noprompt
            echo "temp=true" >> "$GITHUB_OUTPUT"
          fi
          echo "ANDROID_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build APK and App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'temporary-key' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'temporary-key' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'nametag' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Collect files and Digital Asset Links
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'temporary-key' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'nametag' }}
        run: |
          mkdir -p dist
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          cp "$APK" "dist/NameTag-${ANDROID_VERSION_NAME}.apk"
          cp "$AAB" "dist/NameTag-${ANDROID_VERSION_NAME}.aab"
          SHA=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_FILE" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          PKG="${ANDROID_PACKAGE_ID:-$(node -p "require('./scripts/android/twa-config.json').packageId")}"
          HOST="${PWA_HOST:-$(node -p "require('./scripts/android/twa-config.json').host")}"
          node -e "console.log(JSON.stringify([{relation:['delegate_permission/common.handle_all_urls'],target:{namespace:'android_app',package_name:process.argv[1],sha256_cert_fingerprints:[process.argv[2]]}}],null,2))" "$PKG" "$SHA" > dist/assetlinks.json
          {
            echo "## NameTag ${ANDROID_VERSION_NAME}"
            echo ""
            echo "Download the APK from the **Artifacts** section below (NameTag-android)."
            echo ""
            echo "- Site: https://${HOST}"
            echo "- Package: \`${PKG}\`"
            echo "- Signing certificate SHA-256: \`${SHA}\`"
            if [ "${{ steps.key.outputs.temp }}" = "true" ]; then
              echo ""
              echo "> **Test build with a throwaway key.** The app works but shows a browser bar, and a later build cannot update it in place. Add the signing secrets for real builds."
            else
              echo ""
              echo "To remove the browser bar in the app, add this value to Render as environment variable **ANDROID_CERT_SHA256** and redeploy:"
              echo ""
              echo "\`\`\`"
              echo "${SHA}"
              echo "\`\`\`"
              echo "Then check https://${HOST}/.well-known/assetlinks.json shows it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: NameTag-android
          path: dist/*
          if-no-files-found: error

      - name: GitHub Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NameTag-*.apk
            dist/NameTag-*.aab
          generate_release_notes: true
