# Builds the NameTag Android app: the web app in public/ is bundled inside the APK (Capacitor), so it
# opens like a normal app, works fully offline and does not depend on the website.
#
# Output: a signed APK (install directly) and an AAB (Google Play), attached to a GitHub Release
# (direct download on the phone) and to the run's artifacts.
#
# One-time setup: create the signing key with the "Android signing key (run once)" workflow and add
# its four values as repository secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS. Without them a throwaway key is used (fine for a test,
# but a later build cannot update that install).
name: Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 1.2.0 (empty: version from package.json)'
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Only platform-tools: Google removed the legacy 'tools' package that this action requests by default.
      # The Android Gradle plugin downloads the SDK platform and build-tools it needs by itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Check web app
        run: node scripts/check.mjs

      - name: Version
        run: |
          V="${{ inputs.version_name }}"
          if [ -z "$V" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$V" ]; then V=$(node -p "require('./package.json').version"); fi
          echo "ANDROID_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "Version $V (code $ANDROID_VERSION_CODE)"

      - name: Install Capacitor
        run: npm ci --no-audit --no-fund

      - name: Create and prepare the Android project
        run: |
          rm -rf android
          npx cap add android
          node scripts/android/prepare.mjs
          npx cap sync android
          node scripts/check.mjs

      - name: Signing key
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/nametag.keystore"
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            echo "temp=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key secrets found. Building with a throwaway key (test only). Run the 'Android signing key (run once)' workflow and add the secrets."
            keytool -genkeypair -keystore "$KS" -alias nametag -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass temporary-key -keypass temporary-key -dname "CN=NameTag test, O=NameTag" -noprompt
            echo "temp=true" >> "$GITHUB_OUTPUT"
          fi
          echo "ANDROID_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build APK and App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'temporary-key' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'temporary-key' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'nametag' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify and collect
        run: |
          mkdir -p dist
          APK=$(ls android/app/build/outputs/apk/release/*.apk | grep -v -- '-unsigned' | head -1 || true)
          if [ -z "$APK" ]; then echo "::error::Only an unsigned APK was produced; Android would refuse to install it. Check the signing step."; ls -la android/app/build/outputs/apk/release/; exit 1; fi
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --verbose --print-certs "$APK" | head -8
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT" dump badging "$APK" | head -4
          cp "$APK" "dist/NameTag-${ANDROID_VERSION_NAME}.apk"
          cp android/app/build/outputs/bundle/release/*.aab "dist/NameTag-${ANDROID_VERSION_NAME}.aab"
          {
            echo "## NameTag ${ANDROID_VERSION_NAME} for Android"
            echo ""
            echo "A self-contained app: it works offline and does not need the website."
            if [ "${{ steps.key.outputs.temp }}" = "true" ]; then
              echo ""
              echo "> **Test build with a throwaway key.** It installs and works, but a later build cannot update it in place. Add the signing secrets for real builds."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: NameTag-android
          path: dist/*
          if-no-files-found: error

      # Tag builds become a normal release; manual builds a pre-release. Either way the APK is a direct
      # download (run artifacts always arrive as .zip, which Android cannot install).
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && format('NameTag {0}', github.ref_name) || format('NameTag test build {0} ({1})', github.run_number, env.ANDROID_VERSION_NAME) }}
          prerelease: ${{ github.ref_type != 'tag' }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/NameTag-*.apk
            dist/NameTag-*.aab
          generate_release_notes: true

      - name: Download link
        run: |
          T="${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Install on your phone" >> "$GITHUB_STEP_SUMMARY"
          echo "Open this link on the phone and tap the .apk: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${T}" >> "$GITHUB_STEP_SUMMARY"
