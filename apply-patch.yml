# Applies a .patch file you upload to the repo, commits the result, and (optionally) starts the Android APK build.
#
# One-time setup: add this file to the repo as .github/workflows/apply-patch.yml
# (GitHub web: Add file > Create new file, paste, commit).
#
# Use:  upload the patch into the  patches/  folder (Add file > Upload files). The push starts this workflow.
#       Or run it by hand: Actions > "Apply patch" > Run workflow.
#
# "Force" means it keeps trying until the patch goes in:
#   1. already applied?      -> skipped (nothing to do)
#   2. clean apply
#   3. 3-way merge           (works when the files changed a little since the patch was made)
#   4. apply what fits       (hunks that cannot be placed are listed in the run summary; set allow_partial=false to fail instead)
# A patch that changes .github/workflows/ cannot be pushed by Actions (GitHub blocks it); it fails early with a clear message.
name: Apply patch

on:
  push:
    paths: ['patches/*.patch']
  workflow_dispatch:
    inputs:
      patch:
        description: 'Patch file name inside patches/ (empty = every .patch there, in name order)'
        required: false
      allow_partial:
        description: 'If a patch only partly fits, still apply the parts that fit'
        type: boolean
        default: true
      build_apk:
        description: 'Start the Android APK build after applying'
        type: boolean
        default: true
      version_name:
        description: 'APK version name, e.g. 1.2.1 (empty: version from package.json)'
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PATCH_NAME: ${{ inputs.patch }}
      ALLOW_PARTIAL: ${{ github.event_name == 'push' && 'true' || inputs.allow_partial }}
      BUILD_APK: ${{ github.event_name == 'push' && 'true' || inputs.build_apk }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patches
        id: apply
        shell: bash
        run: |
          set -u
          git config user.name  "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          mkdir -p patches/applied

          if [ -n "$PATCH_NAME" ]; then FILES="patches/${PATCH_NAME##*/}"; else FILES=$(ls patches/*.patch 2>/dev/null | sort || true); fi
          if [ -z "$FILES" ] || ! ls $FILES >/dev/null 2>&1; then
            echo "::error::No patch found. Upload a .patch file into the patches/ folder."; exit 1
          fi

          # Back to the last commit, including files a failed attempt may have created (patches/ is kept).
          restore() { git reset -q --hard HEAD; git clean -fdq -e patches/; }

          applied=0; skipped=0
          {
            echo "## Apply patch"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          for f in $FILES; do
            echo "::group::$f"
            name=$(basename "$f")

            if git apply --numstat "$f" | awk '{print $3}' | grep -q '^\.github/workflows/'; then
              echo "::error::$name changes files in .github/workflows/. GitHub does not let Actions push workflow changes. Edit those files by hand in the GitHub web editor, and remove them from the patch."
              exit 1
            fi

            how=""
            if git apply -R --check "$f" 2>/dev/null; then
              how="already applied"; skipped=$((skipped+1))
            elif git apply --whitespace=nowarn "$f" 2>/tmp/err; then
              how="clean"
            else
              cat /tmp/err
              restore
              if git apply --3way --whitespace=nowarn "$f" 2>/tmp/err; then
                how="3-way merge"
              else
                cat /tmp/err
                restore
                find . -name '*.rej' -not -path './.git/*' -delete
                git apply --reject --whitespace=fix "$f" 2>/tmp/err || true
                cat /tmp/err
                rej=$(find . -name '*.rej' -not -path './.git/*' | sort)
                if [ -n "$rej" ]; then
                  {
                    echo "**$name: some parts did not fit**"
                    echo '```'
                    for r in $rej; do echo "--- $r"; cat "$r"; done
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
                  find . -name '*.rej' -not -path './.git/*' -delete
                  if [ "$ALLOW_PARTIAL" != "true" ]; then
                    restore
                    echo "::error::$name does not apply cleanly and allow_partial is off. Nothing was changed."; exit 1
                  fi
                  how="partial (see summary)"
                elif git status --porcelain | grep -q .; then
                  how="applied (fuzzy)"
                else
                  echo "::error::$name could not be applied at all. The repository may have changed too much since the patch was made."; exit 1
                fi
              fi
            fi

            find . -name '*.orig' -not -path './.git/*' -delete
            git mv -f "$f" "patches/applied/$name" 2>/dev/null || mv -f "$f" "patches/applied/$name"
            git add -A
            if git diff --cached --quiet; then
              echo "No changes from $name."
            else
              git commit -q -m "Apply patch: $name ($how)"
              applied=$((applied+1))
            fi
            echo "- \`$name\`: $how" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

          echo "applied=$applied" >> "$GITHUB_OUTPUT"
          if [ "$applied" -eq 0 ]; then echo "Nothing new to push."; fi

      - name: Push
        if: steps.apply.outputs.applied != '0'
        run: |
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
          done
          exit 1

      - name: Start the Android APK build
        if: steps.apply.outputs.applied != '0' && env.BUILD_APK == 'true'
        run: |
          if [ -n "$VERSION_NAME" ]; then
            gh workflow run android.yml --ref "$GITHUB_REF_NAME" -f version_name="$VERSION_NAME"
          else
            gh workflow run android.yml --ref "$GITHUB_REF_NAME"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Android APK build started: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/android.yml" >> "$GITHUB_STEP_SUMMARY"
