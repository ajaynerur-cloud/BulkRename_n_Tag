# Builds Windows .exe files of the restore tools (tools/restore_extensions_gui.py = window, tools/restore_extensions.py = command line).
# Run: Actions > "Build Windows EXE" > Run workflow. Download the "windows-exe" artifact from the run.
# Push a tag such as v1.0.0 to also attach the .exe files to a GitHub Release.
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    paths-ignore: ['**.md']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only used to attach the .exe files to a release when a v* tag is pushed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build window version (no console)
        run: pyinstaller --onefile --windowed --clean --name RestoreExtensions tools/restore_extensions_gui.py

      - name: Build command-line version
        run: pyinstaller --onefile --console --clean --name RestoreExtensionsCLI tools/restore_extensions.py

      - name: Smoke test the command-line exe
        shell: pwsh
        run: |
          .\dist\RestoreExtensionsCLI.exe --help
          # round trip: a.js -> a.txt recorded in a map, restored by the exe
          New-Item -ItemType Directory -Force smoke | Out-Null
          Set-Content smoke\a.txt 'console.log(1)'
          Set-Content smoke\rename-map.json '[{"original":"a.js","renamed":"a.txt"}]'
          .\dist\RestoreExtensionsCLI.exe smoke --json smoke\rename-map.json --yes
          if (-not (Test-Path smoke\a.js)) { throw 'restore failed: a.js not found' }

      - name: Upload .exe files
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
