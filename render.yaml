# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    runtime: static
    name: nametag
    buildCommand: node scripts/stamp-version.mjs
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    envVars:
      # Android app (optional). Package id must match the APK (see scripts/android/twa-config.json).
      - key: ANDROID_PACKAGE_ID
        value: app.nametag.twa
      # SHA-256 fingerprint(s) of the Android signing certificate, comma-separated. Shown by the
      # "Android APK" GitHub workflow. When set, /.well-known/assetlinks.json is published.
      - key: ANDROID_CERT_SHA256
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data: blob: https://coverartarchive.org https://*.archive.org; media-src 'self' blob:; connect-src 'self' https://musicbrainz.org https://coverartarchive.org https://*.archive.org https://lrclib.net; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; font-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'"
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /.well-known/assetlinks.json
        name: Content-Type
        value: application/json
      - path: /.well-known/assetlinks.json
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
